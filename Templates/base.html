<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DARJZ Bank{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --surface2:  #f0f3fa;
  --border:    #dde3f0;
  --navy:      #003168;
  --navy2:     #00499e;
  --gold:      #f5b800;
  --gold2:     #ffd040;
  --text:      #1a2540;
  --muted:     #7a8aaa;
  --red:       #c0392b;
  --green:     #1a7a4a;
  --r:         8px;
  --shadow:    0 2px 12px rgba(0,49,104,.08);
  --shadow-lg: 0 4px 24px rgba(0,49,104,.13);
}

body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

.topbar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 60%,var(--gold) 100%);height:4px;width:100%}

/* NAV */
nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:0 2px 12px rgba(0,49,104,.08);
  padding:0 40px;display:flex;align-items:center;height:64px;
  position:sticky;top:0;z-index:99;
}
.brand{
  font-family:'Playfair Display',serif;font-weight:900;font-size:21px;
  color:var(--navy);text-decoration:none;margin-right:32px;
  display:flex;align-items:center;gap:10px;letter-spacing:.5px;
}
.brand-box{
  width:36px;height:36px;background:var(--navy);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,49,104,.3);
}
.brand-box span{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--gold)}
.brand em{color:var(--gold);font-style:normal}

nav a.nl{
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;
  padding:0 13px;height:64px;display:flex;align-items:center;
  border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;
}
nav a.nl:hover{color:var(--navy)}
nav a.nl.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}

/* LAYOUT */
.wrap{max-width:1100px;margin:0 auto;padding:44px 32px}

/* PAGE HEADER */
.ph{margin-bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ph h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.ph p{color:var(--muted);font-size:12px;margin-top:5px;font-weight:400}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;margin-bottom:22px;box-shadow:var(--shadow)}
.clabel{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--navy2);font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.clabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:6px;
  padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s;width:100%;
}
input:focus,select:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(0,73,158,.1)}
select option{background:#fff}
.brow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}

/* BUTTONS */
.btn{
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  padding:10px 22px;border-radius:6px;border:none;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  transition:all .15s;white-space:nowrap;
}
.btn-p{background:var(--navy);color:#fff}
.btn-p:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,49,104,.28)}
.btn-gold{background:var(--gold);color:var(--navy);font-weight:700}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-g{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-g:hover{border-color:var(--navy);color:var(--navy)}
.btn-d{background:transparent;border:1.5px solid #e8c0bc;color:var(--red)}
.btn-d:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:5px 13px;font-size:12px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:2px solid var(--border);font-weight:600}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,49,104,.02)}
.mono{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px}

/* ALERT */
.alert{padding:13px 18px;border-radius:var(--r);font-size:13px;margin-bottom:18px;border-left:4px solid;display:flex;align-items:center;gap:8px}
.alert-ok{background:#eaf7f0;border-color:var(--green);color:var(--green)}
.alert-err{background:#fdf2f1;border-color:var(--red);color:var(--red)}

/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.4px}
.badge-c{background:#e8f0ff;color:var(--navy2);border:1px solid #c4d4f5}
.badge-s{background:#fff8e0;color:#7a5f00;border:1px solid #f5d060}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.stat-v{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy)}
.stat-l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px;font-weight:600}

/* QUICK ACTION GRID */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.qcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 18px;text-align:center;text-decoration:none;color:var(--navy);
  font-weight:600;font-size:13px;box-shadow:var(--shadow);
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.qcard:hover{border-color:var(--navy2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.qcard-icon{font-size:24px}
.qcard.gold{border-top:3px solid var(--gold)}

/* EMPTY */
.empty{text-align:center;padding:52px;color:var(--muted);font-size:13px}
.empty-i{font-size:36px;margin-bottom:12px;opacity:.3}

/* SECTION DIVIDER */
.section-note{font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 14px;background:var(--surface2);border-radius:6px;border-left:3px solid var(--gold)}

/* FOOTER */
footer{margin-top:60px;border-top:1px solid var(--border);padding:22px 40px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
footer strong{color:var(--navy);font-weight:700}

@media(max-width:768px){
  nav{padding:0 12px;overflow-x:auto;gap:0}
  .wrap{padding:20px 14px}
  .ph{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="topbar"></div>

<nav>
  <a class="brand" href="/">
    <div class="brand-box"><span>D</span></div>
    DARJZ <em>Bank</em>
  </a>
  <a class="nl {% if request.path=='/' %}on{% endif %}"           href="/">Dashboard</a>
  <a class="nl {% if '/persons' in request.path %}on{% endif %}"  href="/persons">Persons</a>
  <a class="nl {% if '/chequing' in request.path %}on{% endif %}" href="/chequing">Chequing</a>
  <a class="nl {% if '/savings' in request.path %}on{% endif %}"  href="/savings">Savings</a>
  <a class="nl {% if '/deposits' in request.path %}on{% endif %}" href="/deposits">Deposits</a>
  <a class="nl {% if '/transfers' in request.path %}on{% endif %}" href="/transfers">Transfers</a>
  <a class="nl {% if '/paybills' in request.path %}on{% endif %}"  href="/paybills">Pay Bills</a>
  <a class="nl {% if '/payees' in request.path %}on{% endif %}"    href="/payees">Payees</a>
  <a class="nl {% if '/close' in request.path %}on{% endif %}"     href="/close">Close Acct</a>
</nav>

<div class="wrap">
{% block content %}{% endblock %}
</div>

<footer>
  <span><strong>DARJZ Bank</strong> — Secure Online Banking Portal</span>
  <span>© 2025 DARJZ Bank. All rights reserved.</span>
</footer>
</body>
</html>
